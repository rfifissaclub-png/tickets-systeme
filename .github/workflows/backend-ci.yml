name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/tms-backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/tms-backend/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: backend/tms-backend

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tms
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: tms_testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tms -d tms_testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, pgsql, bcmath, intl, zip
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: backend/tms-backend/vendor
          key: composer-${{ hashFiles('backend/tms-backend/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: tms_testing
          DB_USERNAME: tms
          DB_PASSWORD: secret
          REDIS_CLIENT: predis
          REDIS_HOST: 127.0.0.1

      - name: Run Pest
        run: vendor/bin/pest --ci
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: tms_testing
          DB_USERNAME: tms
          DB_PASSWORD: secret
          REDIS_CLIENT: predis
          REDIS_HOST: 127.0.0.1

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Check code style (Pint)
        run: vendor/bin/pint --test

name: Docker Build

# Validates both production Dockerfiles build cleanly on every PR (no push —
# just proves the image builds), then publishes to GHCR on merge to main.
# Uses the built-in GITHUB_TOKEN, so no registry secrets need to be configured.

on:
  push:
    branches: [main]
    paths:
      - "backend/tms-backend/**"
      - "frontend/**"
      - "infra/docker/**"
      - ".github/workflows/docker-build.yml"
  pull_request:
    paths:
      - "backend/tms-backend/**"
      - "frontend/**"
      - "infra/docker/**"
      - ".github/workflows/docker-build.yml"

permissions:
  contents: read
  packages: write

jobs:
  backend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/php/Dockerfile
          target: production
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/frontend/Dockerfile
          target: production
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=https://api.tms.example.com/api/v1
            VITE_APP_URL=https://api.tms.example.com
            VITE_REVERB_APP_KEY=replace-at-deploy-time
            VITE_REVERB_HOST=api.tms.example.com
            VITE_REVERB_PORT=443
            VITE_REVERB_SCHEME=https

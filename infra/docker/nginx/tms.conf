limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/m;

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Above php.ini's post_max_size (30M) and the app's ATTACHMENTS_MAX_SIZE_KB
    # (25M) — otherwise nginx itself rejects a request at the app's own
    # configured limit before PHP ever sees it (see php.ini's comment).
    client_max_body_size 32m;
    limit_req_status 429;

    include /etc/nginx/security-headers.conf;

    # API-only backend: no inline scripts/styles are ever served from here, so a
    # tight default-src is safe. The frontend SPA (infra/docker/frontend) has its own CSP.
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Never serve dotfiles (.env, .git, ...) or storage internals directly.
    location ~ /\. { deny all; }
    location ~ ^/(storage/app|bootstrap/cache|\.env) { deny all; }

    # Swagger UI needs a slightly relaxed CSP for its own inline assets.
    location /docs {
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:" always;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /api/v1/auth {
        limit_req zone=api_auth burst=5 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
        limit_req zone=api_general burst=40 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60;
        fastcgi_hide_header X-Powered-By;
    }

    access_log /var/log/nginx/tms_access.log;
    error_log /var/log/nginx/tms_error.log warn;
}

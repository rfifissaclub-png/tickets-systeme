# Shared security headers — included by every server block. Each server
# block (backend API, frontend SPA) adds its own Content-Security-Policy on
# top of this, since the right CSP differs per app; keeping CSP out of this
# shared file avoids two conflicting CSP headers being sent at once.
#
# HSTS is safe to send even though these containers terminate plain HTTP —
# they sit behind a TLS-terminating load balancer/ingress in any real
# deployment (see infra README), and browsers only start enforcing HSTS once
# they've seen it over an actual HTTPS connection.
server_tokens off;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

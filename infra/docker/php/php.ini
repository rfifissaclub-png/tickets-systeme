; TMS backend PHP runtime settings.
memory_limit = 256M
; Must stay above ATTACHMENTS_MAX_SIZE_KB (default 25M, see config/attachments.php)
; and post_max_size must in turn stay above upload_max_filesize — it caps the
; whole multipart body, not just the file, so a request at exactly the app's
; configured limit would otherwise be truncated by PHP itself (silently:
; $_FILES ends up empty, never reaching Laravel's own clean validation error).
upload_max_filesize = 26M
post_max_size = 30M
max_execution_time = 60
expose_php = Off

date.timezone = UTC

; Cookie security (secure/httponly/samesite) is controlled per-environment via
; SESSION_SECURE_COOKIE/SESSION_HTTP_ONLY/SESSION_SAME_SITE in .env, not here —
; hardcoding cookie_secure would break local dev over plain HTTP.

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; validate_timestamps=1 costs a per-request mtime check but picks up bind-mounted
; source changes in local dev without a container restart. A production image
; (baked-in code, no bind mount) should flip this to 0 in the Phase 7 CI/CD pass.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.save_comments = 1
opcache.jit_buffer_size = 64M
opcache.jit = tracing

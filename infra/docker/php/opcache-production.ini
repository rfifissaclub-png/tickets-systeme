; Overrides opcache.ini's dev-friendly defaults for the production image target
; only (infra/docker/php/Dockerfile's `production` stage) — code is baked into
; the image there, not bind-mounted, so skipping the per-request mtime check
; is both safe and faster. Loaded after zz-opcache.ini (conf.d files load in
; filename order), so this file's values win.
opcache.validate_timestamps = 0

name: tms

# Cross-device configuration:
#   All host-facing ports and the browser-facing host name are configurable
#   via variables below (with sensible localhost defaults). Copy this file to
#   `.env` in this directory (or export the variables) and override them to:
#     - Free up ports that conflict with other services on your machine.
#     - Access the stack from another device (phone, tablet, another PC):
#         set APP_HOST=<your-machine-ip>  (e.g. 192.168.1.42)
#   Then browse to http://<your-machine-ip>:<NGINX_PORT>
#
# Internal container-to-container hostnames (DB_HOST, REDIS_HOST, etc.) stay
# fixed — they resolve via Docker's internal DNS and are not visible to the
# browser.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # POSTGRES_USER is deliberately unset: Postgres then bootstraps as its
      # own default "postgres" superuser (this password applies to that
      # role) instead of making the app's own "tms" role a superuser — see
      # 00-create-app-role.sql for why that distinction matters.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-tms}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # docker-entrypoint-initdb.d scripts run in filename order — 00- must
      # create the non-superuser "tms" app role (see that file) before
      # anything else runs, so it's mounted first alphabetically.
      - ./docker/postgres/00-create-app-role.sql:/docker-entrypoint-initdb.d/00-create-app-role.sql:ro
      - ./docker/postgres/init-testing-db.sql:/docker-entrypoint-initdb.d/init-testing-db.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tms -d tms"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tms-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-tms-minio-secret}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the tms-storage bucket on first boot, then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-tms-minio} ${MINIO_ROOT_PASSWORD:-tms-minio-secret} &&
      mc mb --ignore-existing local/tms-storage
      "

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"

  # Scans every attachment upload before it's persisted — see
  # App\Services\Attachments\ClamAvScanner and config/attachments.php.
  # The official image runs freshclam once on boot to fetch signatures
  # before clamd starts, which is why its healthcheck (and therefore
  # backend/queue's startup) takes a couple of minutes on a cold volume.
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav
    ports:
      - "${CLAMAV_PORT:-3310}:3310"
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  backend:
    build:
      context: ..
      dockerfile: infra/docker/php/Dockerfile
      target: development
      args:
        PHP_VERSION: ${PHP_VERSION:-8.4}
        TMS_UID: ${TMS_UID:-1000}
        TMS_GID: ${TMS_GID:-1000}
    volumes:
      - ../backend/tms-backend:/var/www/html
    env_file:
      - ../backend/tms-backend/.env
    environment:
      # Override the .env file's localhost defaults with the configurable
      # APP_HOST so emails, Swagger docs, and CORS allow the real host when
      # accessed from another device on the network.
      APP_URL: http://${APP_HOST:-localhost}:${NGINX_PORT:-8080}
      FRONTEND_URL: http://${APP_HOST:-localhost}:${FRONTEND_PORT:-8081}
      L5_SWAGGER_CONST_HOST: http://${APP_HOST:-localhost}:${NGINX_PORT:-8080}/api/v1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy

  queue:
    build:
      context: ..
      dockerfile: infra/docker/php/Dockerfile
      target: development
      args:
        PHP_VERSION: ${PHP_VERSION:-8.4}
        TMS_UID: ${TMS_UID:-1000}
        TMS_GID: ${TMS_GID:-1000}
    command: php artisan queue:work --tries=3 --backoff=5
    volumes:
      - ../backend/tms-backend:/var/www/html
    env_file:
      - ../backend/tms-backend/.env
    environment:
      APP_URL: http://${APP_HOST:-localhost}:${NGINX_PORT:-8080}
      FRONTEND_URL: http://${APP_HOST:-localhost}:${FRONTEND_PORT:-8081}
      L5_SWAGGER_CONST_HOST: http://${APP_HOST:-localhost}:${NGINX_PORT:-8080}/api/v1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy

  reverb:
    build:
      context: ..
      dockerfile: infra/docker/php/Dockerfile
      target: development
      args:
        PHP_VERSION: ${PHP_VERSION:-8.4}
        TMS_UID: ${TMS_UID:-1000}
        TMS_GID: ${TMS_GID:-1000}
    # Binds 0.0.0.0:8080 *inside* this container (REVERB_SERVER_HOST/PORT) —
    # unrelated to nginx's own 8080, which is a different container. Exposed
    # to the host on 8085 so a browser (outside Docker) can reach it; the
    # backend/queue containers reach it over the internal network as
    # "reverb:8080" instead (see REVERB_HOST/REVERB_PORT in .env).
    command: php artisan reverb:start
    ports:
      - "${REVERB_PORT:-8085}:8080"
    volumes:
      - ../backend/tms-backend:/var/www/html
    env_file:
      - ../backend/tms-backend/.env
    environment:
      APP_URL: http://${APP_HOST:-localhost}:${NGINX_PORT:-8080}
      FRONTEND_URL: http://${APP_HOST:-localhost}:${FRONTEND_PORT:-8081}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    build:
      context: ..
      dockerfile: infra/docker/nginx/Dockerfile
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ../backend/tms-backend:/var/www/html:ro
    depends_on:
      - backend

  # Production-style build of the SPA, served by its own nginx — mirrors what
  # actually ships (infra/docker/frontend/Dockerfile), unlike local dev where
  # `npm run dev` is run directly on the host against this same backend.
  frontend:
    build:
      context: ..
      dockerfile: infra/docker/frontend/Dockerfile
      args:
        VITE_API_URL: http://${APP_HOST:-localhost}:${NGINX_PORT:-8080}/api/v1
        VITE_APP_URL: http://${APP_HOST:-localhost}:${NGINX_PORT:-8080}
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-192812dbb36576c8ee12}
        VITE_REVERB_HOST: ${APP_HOST:-localhost}
        VITE_REVERB_PORT: "${REVERB_PORT:-8085}"
        VITE_REVERB_SCHEME: ${REVERB_SCHEME:-http}
    environment:
      API_ORIGIN: http://${APP_HOST:-localhost}:${NGINX_PORT:-8080}
      WS_ORIGIN: ${REVERB_SCHEME:-http}://${APP_HOST:-localhost}:${REVERB_PORT:-8085}
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    depends_on:
      - nginx

volumes:
  postgres_data:
  redis_data:
  minio_data:
  clamav_data:

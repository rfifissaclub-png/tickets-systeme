name: tms

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tms
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: tms
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-testing-db.sql:/docker-entrypoint-initdb.d/init-testing-db.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tms -d tms"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tms-minio
      MINIO_ROOT_PASSWORD: tms-minio-secret
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the tms-storage bucket on first boot, then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 tms-minio tms-minio-secret &&
      mc mb --ignore-existing local/tms-storage
      "

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

  backend:
    build:
      context: ..
      dockerfile: infra/docker/php/Dockerfile
      target: development
    volumes:
      - ../backend/tms-backend:/var/www/html
    env_file:
      - ../backend/tms-backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  queue:
    build:
      context: ..
      dockerfile: infra/docker/php/Dockerfile
      target: development
    command: php artisan queue:work --tries=3 --backoff=5
    volumes:
      - ../backend/tms-backend:/var/www/html
    env_file:
      - ../backend/tms-backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  reverb:
    build:
      context: ..
      dockerfile: infra/docker/php/Dockerfile
      target: development
    # Binds 0.0.0.0:8080 *inside* this container (REVERB_SERVER_HOST/PORT) —
    # unrelated to nginx's own 8080, which is a different container. Exposed
    # to the host on 8085 so a browser (outside Docker) can reach it; the
    # backend/queue containers reach it over the internal network as
    # "reverb:8080" instead (see REVERB_HOST/REVERB_PORT in .env).
    command: php artisan reverb:start
    ports:
      - "8085:8080"
    volumes:
      - ../backend/tms-backend:/var/www/html
    env_file:
      - ../backend/tms-backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    build:
      context: ..
      dockerfile: infra/docker/nginx/Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ../backend/tms-backend:/var/www/html:ro
    depends_on:
      - backend

  # Production-style build of the SPA, served by its own nginx — mirrors what
  # actually ships (infra/docker/frontend/Dockerfile), unlike local dev where
  # `npm run dev` is run directly on the host against this same backend.
  frontend:
    build:
      context: ..
      dockerfile: infra/docker/frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:8080/api/v1
        VITE_APP_URL: http://localhost:8080
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-192812dbb36576c8ee12}
        VITE_REVERB_HOST: localhost
        VITE_REVERB_PORT: "8085"
        VITE_REVERB_SCHEME: http
    environment:
      API_ORIGIN: http://localhost:8080
      WS_ORIGIN: ws://localhost:8085
    ports:
      - "8081:80"
    depends_on:
      - nginx

volumes:
  postgres_data:
  redis_data:
  minio_data:
